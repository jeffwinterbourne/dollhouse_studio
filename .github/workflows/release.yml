name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (without leading v)"
        required: false
        default: "0.1.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Hygiene, Lint & Test Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/hygiene_check.py
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgl1-mesa-dev libwayland-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build-windows:
    name: Package Windows (Setup EXE + Portable ZIP)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag.StartsWith("v")) { $v = $tag.Substring(1) } else { $v = "${{ github.event.inputs.version }}" }
          if (-not $v) { $v = "0.1.0" }
          echo "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build release binary
        run: cargo build --release -p dh-app
      - name: Package Portable ZIP and NSIS Setup Installer
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist, portable | Out-Null
          Copy-Item target\release\dollhouse-studio.exe, LICENSE, README.md portable\
          Compress-Archive -Path portable\* -DestinationPath "dist\dollhouse-studio-v$v-windows-x64-portable.zip" -Force
          makensis "-DVERSION=$v" packaging\windows\installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist\*

  build-macos:
    name: Package macOS (DMG)
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Determine version
        id: ver
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == v* ]]; then V="${TAG#v}"; else V="${{ github.event.inputs.version }}"; fi
          V="${V:-0.1.0}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Build release binary
        run: cargo build --release -p dh-app
      - name: Assemble .app bundle and DMG
        run: |
          V="${{ steps.ver.outputs.version }}"
          APP_DIR="dist/Dollhouse Studio.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources" AppIcon.iconset
          cp target/release/dollhouse-studio "$APP_DIR/Contents/MacOS/dollhouse-studio"
          chmod +x "$APP_DIR/Contents/MacOS/dollhouse-studio"
          sed "s/0\.1\.0/$V/g" packaging/macos/Info.plist > "$APP_DIR/Contents/Info.plist"
          for sz in 16 32 64 128 256 512; do
            sips -z $sz $sz assets/icon.png --out "AppIcon.iconset/icon_${sz}x${sz}.png" >/dev/null
          done
          iconutil -c icns AppIcon.iconset -o "$APP_DIR/Contents/Resources/AppIcon.icns"
          ARCH="$(uname -m)"
          hdiutil create -volname "Dollhouse Studio $V" -srcfolder "$APP_DIR" -ov -format UDZO "dist/dollhouse-studio-v${V}-macos-${ARCH}.dmg"
          rm -rf "$APP_DIR" AppIcon.iconset
      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/*.dmg

  build-linux:
    name: Package Linux (AppImage + tar.gz)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI dependencies and AppImage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgl1-mesa-dev libwayland-dev pkg-config libfuse2 wget
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Determine version
        id: ver
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == v* ]]; then V="${TAG#v}"; else V="${{ github.event.inputs.version }}"; fi
          V="${V:-0.1.0}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Build release binary
        run: cargo build --release -p dh-app
      - name: Package tar.gz and AppImage
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p dist "dollhouse-studio-${V}" AppDir/usr/bin AppDir/usr/share/icons/hicolor/512x512/apps
          cp target/release/dollhouse-studio LICENSE README.md "dollhouse-studio-${V}/"
          tar -czf "dist/dollhouse-studio-v${V}-linux-x86_64.tar.gz" "dollhouse-studio-${V}"
          cp target/release/dollhouse-studio AppDir/usr/bin/dollhouse-studio
          cp assets/icon.png AppDir/dollhouse-studio.png
          cp assets/icon.png AppDir/usr/share/icons/hicolor/512x512/apps/dollhouse-studio.png
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=Dollhouse Studio' \
            'Exec=dollhouse-studio' \
            'Icon=dollhouse-studio' \
            'Categories=Graphics;Engineering;3DGraphics;' > AppDir/dollhouse-studio.desktop
          printf '%s\n' \
            '#!/bin/sh' \
            'HERE="$(dirname "$(readlink -f "$0")")"' \
            'exec "$HERE/usr/bin/dollhouse-studio" "$@"' > AppDir/AppRun
          chmod +x AppDir/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir "dist/dollhouse-studio-v${V}-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Generate SHA256SUMS
        working-directory: release-files
        run: sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-files/*
